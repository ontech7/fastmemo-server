# FastMemo Server behind a Cloudflare Tunnel: a public HTTPS address on your domain, with no port opened on the router. For a
# home server behind a router you can't configure (or CGNAT). The domain must be on Cloudflare.
#
#   cp .env.example .env      # set CLOUDFLARE_TUNNEL_TOKEN (the tunnel's token, from the Cloudflare dashboard)
#   docker compose -f docker-compose.cloudflare.yml up -d
#
# In the tunnel's routes, publish your hostname (e.g. notes.example.com) with the service http://fastmemo:8787.
# The app connects to https://notes.example.com. Cloudflare decrypts the traffic on its servers: see the README's HTTPS section.
services:
  fastmemo:
    image: ${FASTMEMO_IMAGE:-ghcr.io/ontech7/fastmemo-server:1} # the published image (docker-compose.build.yml builds this folder instead)
    container_name: fastmemo-server
    restart: unless-stopped
    # Locked down: the server only writes in /data (the volume) and /tmp.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    environment:
      # The server's settings from .env, by name: the other services' secrets there (a tunnel token, an auth key) stay
      # out of this container.
      FASTMEMO_ACCESS_KEY: ${FASTMEMO_ACCESS_KEY:-}
      FASTMEMO_ADMIN_KEY: ${FASTMEMO_ADMIN_KEY:-}
      TZ: ${TZ:-}
      MAX_DEVICES: ${MAX_DEVICES:-}
      MAX_NOTE_MB: ${MAX_NOTE_MB:-}
      MAX_BODY_MB: ${MAX_BODY_MB:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "true"
    volumes:
      - fastmemo-data:/data

  cloudflared:
    image: cloudflare/cloudflared:2026.10.3
    container_name: fastmemo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - fastmemo

volumes:
  fastmemo-data:
