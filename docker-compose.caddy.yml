# FastMemo Server behind Caddy, which gets and renews the HTTPS certificate on its own: for a VPS (or a home server with
# ports 80 and 443 forwarded) and a domain that points to it.
#
#   cp .env.example .env      # set DOMAIN (e.g. notes.example.com) and FASTMEMO_ACCESS_KEY
#   docker compose -f docker-compose.caddy.yml up -d
#
# The app connects to https://<DOMAIN>.
services:
  fastmemo:
    image: ghcr.io/ontech7/fastmemo-server:latest # downloaded, or built from this folder (see docker-compose.yml)
    build: .
    container_name: fastmemo-server
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "true"
    volumes:
      - fastmemo-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: fastmemo-caddy
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to fastmemo:8787
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fastmemo

volumes:
  fastmemo-data:
  caddy-data:
  caddy-config:
