# FastMemo Server behind Caddy, which gets and renews the HTTPS certificate on its own: for a VPS (or a home server with
# ports 80 and 443 forwarded) and a domain that points to it.
#
#   cp .env.example .env      # set DOMAIN (e.g. notes.example.com) and FASTMEMO_ACCESS_KEY
#   docker compose -f docker-compose.caddy.yml up -d
#
# The app connects to https://<DOMAIN>.
services:
  fastmemo:
    image: ${FASTMEMO_IMAGE:-ghcr.io/ontech7/fastmemo-server:1} # the published image (docker-compose.build.yml builds this folder instead)
    container_name: fastmemo-server
    restart: unless-stopped
    # Locked down: the server only writes in /data (the volume) and /tmp.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    environment:
      # The server's settings from .env, by name: the other services' secrets there (a tunnel token, an auth key) stay
      # out of this container.
      FASTMEMO_ACCESS_KEY: ${FASTMEMO_ACCESS_KEY:-}
      FASTMEMO_ADMIN_KEY: ${FASTMEMO_ADMIN_KEY:-}
      TZ: ${TZ:-}
      MAX_DEVICES: ${MAX_DEVICES:-}
      MAX_NOTE_MB: ${MAX_NOTE_MB:-}
      MAX_BODY_MB: ${MAX_BODY_MB:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      UPDATE_CHECK: ${UPDATE_CHECK:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "true"
    volumes:
      - fastmemo-data:/data

  caddy:
    image: caddy:2-alpine
    container_name: fastmemo-caddy
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN in .env} --to fastmemo:8787
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fastmemo

volumes:
  fastmemo-data:
  caddy-data:
  caddy-config:
