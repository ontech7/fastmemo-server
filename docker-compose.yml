# FastMemo Server with SQLite: the simplest setup (PC, NAS, Raspberry Pi, VPS).
#
#   cp .env.example .env      # then set FASTMEMO_ACCESS_KEY (or leave it empty: one is generated, see the logs)
#   docker compose up -d
#   docker compose logs fastmemo
#
# The server and its dashboard are at http://<this computer's address>:8787. The web app needs HTTPS in front of it (README).
#
# `image` is the published image (amd64 and arm64): Docker downloads it, or builds this folder when it can't.
# `docker compose up -d --build` always builds from the source here.
services:
  fastmemo:
    image: ghcr.io/ontech7/fastmemo-server:latest
    build: .
    container_name: fastmemo-server
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the container: always this port and this folder (PORT above is the one on your computer).
      PORT: "8787"
      DATA_DIR: /data
    volumes:
      - fastmemo-data:/data

volumes:
  fastmemo-data:
