# FastMemo Server with SQLite: the simplest setup (PC, NAS, Raspberry Pi, VPS).
#
#   cp .env.example .env      # then set FASTMEMO_ACCESS_KEY (required: openssl rand -hex 24)
#   docker compose up -d
#   docker compose logs fastmemo
#
# The server and its dashboard are at http://<this computer's address>:8787. The web app needs HTTPS in front of it (README).
#
# `image` is the published image (amd64 and arm64), the newest 1.x unless FASTMEMO_IMAGE in .env says otherwise.
# To build the source in this folder instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  fastmemo:
    image: ${FASTMEMO_IMAGE:-ghcr.io/ontech7/fastmemo-server:1}
    container_name: fastmemo-server
    restart: unless-stopped
    # Locked down: the server only writes in /data (the volume) and /tmp.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    ports:
      - "${PORT:-8787}:8787"
    environment:
      # The server's settings from .env, by name: the other services' secrets there (a tunnel token, an auth key) stay
      # out of this container.
      FASTMEMO_ACCESS_KEY: ${FASTMEMO_ACCESS_KEY:-}
      FASTMEMO_ADMIN_KEY: ${FASTMEMO_ADMIN_KEY:-}
      TZ: ${TZ:-}
      MAX_DEVICES: ${MAX_DEVICES:-}
      MAX_NOTE_MB: ${MAX_NOTE_MB:-}
      MAX_BODY_MB: ${MAX_BODY_MB:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      # Inside the container: always this port and this folder (PORT above is the one on your computer).
      PORT: "8787"
      DATA_DIR: /data
    volumes:
      - fastmemo-data:/data

volumes:
  fastmemo-data:
