# FastMemo Server with PostgreSQL, for who already runs Postgres or prefers it. SQLite (docker-compose.yml) is enough
# for a person or a family: choose this one only if you have a reason to.
#
#   cp .env.example .env      # set POSTGRES_PASSWORD (letters and digits) and FASTMEMO_ACCESS_KEY
#   docker compose -f docker-compose.postgres.yml up -d
services:
  fastmemo:
    image: ${FASTMEMO_IMAGE:-ghcr.io/ontech7/fastmemo-server:1} # the published image (docker-compose.build.yml builds this folder instead)
    container_name: fastmemo-server
    restart: unless-stopped
    # Locked down: the server only writes in /data (the volume) and /tmp.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    ports:
      - "${PORT:-8787}:8787"
    environment:
      # The server's settings from .env, by name: the other services' secrets there (a tunnel token, an auth key) stay
      # out of this container.
      FASTMEMO_ACCESS_KEY: ${FASTMEMO_ACCESS_KEY:-}
      FASTMEMO_ADMIN_KEY: ${FASTMEMO_ADMIN_KEY:-}
      TZ: ${TZ:-}
      MAX_DEVICES: ${MAX_DEVICES:-}
      MAX_NOTE_MB: ${MAX_NOTE_MB:-}
      MAX_BODY_MB: ${MAX_BODY_MB:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      PORT: "8787"
      DATABASE_URL: postgres://fastmemo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/fastmemo
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: fastmemo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fastmemo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fastmemo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmemo -d fastmemo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
