# FastMemo Server with Tailscale in a container next to it: an HTTPS address in your tailnet, with nothing to install on the
# computer. For a NAS (Synology, Unraid, TrueNAS) or any machine where installing Tailscale itself is awkward.
#
#   cp .env.example .env      # set FASTMEMO_ACCESS_KEY, and TS_AUTHKEY (or leave it empty and sign in with the link in the logs)
#   docker compose -f docker-compose.tailscale.yml up -d
#   docker compose -f docker-compose.tailscale.yml logs tailscale
#
# The app connects to https://fastmemo.<your-tailnet>.ts.net (TS_HOSTNAME changes the first part). HTTPS certificates must be
# on in the Tailscale admin (DNS page). tailscale/serve.json says what's served: set AllowFunnel to true there to make the
# address public (Tailscale Funnel, see the README).
services:
  tailscale:
    image: tailscale/tailscale:v1.104.2
    container_name: fastmemo-tailscale
    hostname: ${TS_HOSTNAME:-fastmemo}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true" # sign in once: the auth key can expire, the machine stays in the tailnet
      TS_HOSTNAME: ${TS_HOSTNAME:-fastmemo}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro # the folder, not the file: Tailscale sees changes to serve.json

  fastmemo:
    image: ${FASTMEMO_IMAGE:-ghcr.io/ontech7/fastmemo-server:1} # the published image (docker-compose.build.yml builds this folder instead)
    container_name: fastmemo-server
    restart: unless-stopped
    # Locked down: the server only writes in /data (the volume) and /tmp.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:size=16m"]
    # Shares the Tailscale container's network: Tailscale serves it at 127.0.0.1:8787, and no port is published.
    network_mode: service:tailscale
    environment:
      # The server's settings from .env, by name: the other services' secrets there (a tunnel token, an auth key) stay
      # out of this container.
      FASTMEMO_ACCESS_KEY: ${FASTMEMO_ACCESS_KEY:-}
      FASTMEMO_ADMIN_KEY: ${FASTMEMO_ADMIN_KEY:-}
      TZ: ${TZ:-}
      MAX_DEVICES: ${MAX_DEVICES:-}
      MAX_NOTE_MB: ${MAX_NOTE_MB:-}
      MAX_BODY_MB: ${MAX_BODY_MB:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "true"
    volumes:
      - fastmemo-data:/data
    depends_on:
      - tailscale

volumes:
  fastmemo-data:
  tailscale-state:
